[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rio"
authors = [
    { name = "rio developers", email = "etaoxing@users.noreply.github.com" },
]

description = "A real-time control library for cross-embodiment robot manipulation"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version", "readme"]
requires-python = ">=3.10"

dependencies = [
    "loguru>=0.7.3",
    "rio_hw @ git+https://github.com/mhess840/rio-hw.git@a8add45bd9168b33c938c0a5597a4879e24cefdf",
    "attrs>=24",
    "cloudpickle>=3",
    "atomics>=1.0.3",
    "pyzmq>=26",
    "pillow>=12",
    "pyyaml>=6",
    "imageio-ffmpeg>=0.6",
    "pyserial>=3.5",
    "robodm>=0.1.0",
    "av<=13.1.0",    # required by robodm for proper encoding/decoding
]

[project.scripts]
rio-list-stations = "rio._scripts.list_available:list_stations"
rio-list-robots = "rio._scripts.list_available:list_robots"
rio-list-cameras = "rio._scripts.list_available:list_cameras"
rio-list-interfaces = "rio._scripts.list_available:list_interfaces"

[project.optional-dependencies]
visualizers = ["rerun-sdk", "mujoco", "robot_descriptions", "rerun-loader-mjcf"]
kassow = [
    "pyserial>=3.5",
    "pyrealsense2>=2.59.1; sys_platform != 'darwin'",
    "openvr",
    "sshkeyboard",
    "bleak",
    "evdev; sys_platform == 'linux'",  # clicker (spare mouse as gripper/scale buttons)
    "pin; sys_platform == 'linux'",
    "cmeel-urdfdom>=4,<5; sys_platform == 'linux'",
    "cmeel-tinyxml2==10.0.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.14.0", "ty==0.0.93"]
rlds = ["tensorflow>=2.11.0", "tensorflow-datasets>=4.9.0"]
# LeRobot 0.6+ needs Python >=3.12,<3.14. Hardware and π₀.₅ share this env.
pi = [
    "lerobot[pi,training]==0.6.1; python_version >= '3.12' and python_version < '3.14'",
    "imageio-ffmpeg; python_version >= '3.12'",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings[python]",
    "mkdocs-autorefs",
]


# This removes version constraints from transitive dependencies
[tool.uv]
# ruckig<0.19 is sdist-only and its pinned scikit-build-core no longer builds.
# cmeel-urdfdom/tinyxml2: keep ABI matching libpinocchio 3.8 (Kassow IK).
override-dependencies = [
    "numpy",
    "rerun-sdk",
    "av<=13.1.0",
    "ruckig>=0.19",
    "cmeel-urdfdom>=4,<5",
    "cmeel-tinyxml2==10.0.0",
    # 2.54 has no cp312 Linux wheel; D435i does not need the L515-era pin.
    "pyrealsense2>=2.59.1; python_version >= '3.12' and sys_platform != 'darwin'",
]

[tool.uv.sources]
# The station runs the sibling checkout with its locally built _kord_bridge; CI checks out the pinned commit there.
rio_hw = { path = "../rio-hw", editable = true }

[tool.setuptools.packages.find]
include = ["rio*"]

[tool.setuptools.package-data]
"rio.apps.kassow" = ["homes/*.json", "inlay/*.jpg"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 128
indent-width = 4
extend-exclude = ["third_party/"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "I",   # isort
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "NPY", # NumPy-specific rules
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLW", # pylint warning
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "E731",   # Do not assign a lambda expression, use a def
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*" = ["PLC0415"]
"rio/apps/**/*.py" = ["PLC0415"]
"rio/_tests/*" = ["PLC0415"]
"rio/policies/pi05.py" = ["PLC0415"]
"rio/policies/pi05_resident/*.py" = ["PLC0415"]
"rio/policies/rollout/*.py" = ["PLC0415"]
"rio/data/convert_pi05/*.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["rio/_tests"]
markers = [
    "unit: pure logic, no IPC, no hardware",
    "integration: requires subprocess/IPC, no physical hardware",
    "hardware: requires physical camera/robot/teleop device",
    "gpu: requires CUDA",
    "benchmark: optional middleware performance harness requiring additional backends",
]

[tool.ty.src]
include = ["rio"]
exclude = ["rio/_tests"]

[tool.ty.environment]
python-version = "3.12"
# rio_hw is an editable install of the sibling checkout; ty cannot follow setuptools' editable import hook.
extra-paths = ["../rio-hw"]

[[tool.ty.overrides]]
include = [
    "rio/policies/pi0.py",
    "rio/policies/pi05.py",
    "rio/policies/smolvla.py",
    "rio/policies/gear_sonic.py",
    "rio/policies/gear_sonic_planner.py",
    "rio/policies/rollout/loop.py",
    "rio/visualization/rerun.py",
    "rio/visualization/utils.py",
    "rio/data/rlds_formatter.py",
    "rio/data/convert_pi05/**",
    "rio/data/lerobot_formatter.py",
    "rio/data/recorder.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.typos]
files.extend-exclude = ["*.urdf", "*.usd", "*.usda", "*.mjcf"]

[tool.typos.default.extend-words]
UDID = "UDID"

[tool.typos.default.extend-identifiers]
SharedNDArray = "SharedNDArray"
