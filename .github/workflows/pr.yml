on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rio
    steps:
      - uses: actions/checkout@v4
        with:
          path: rio
      # uv resolves rio_hw from ../rio-hw; check out the newest commit of the repo and branch named in pyproject.toml.
      - id: pin
        run: |
          echo "repo=$(grep -oP 'github\.com/\K[^/]+/rio-hw(?=\.git@)' pyproject.toml)" >> "$GITHUB_OUTPUT"
          echo "ref=$(grep -oP 'rio-hw\.git@\K[^"\s]+' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: rio-hw
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: rio/uv.lock
      - run: uv sync --frozen --group dev
      - run: make check
      - run: make test

  # The default job skips everything that needs LeRobot/Torch (π₀.₅ mapping, conversion, DAgger merge,
  # LeRobot formatter). This job installs the station environment (`pi` group + `kassow` extra) so those
  # tests run on every PR and a lockfile that cannot load on the station (e.g. pinocchio vs urdfdom) fails here.
  test-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_FROZEN: "1"
    defaults:
      run:
        working-directory: rio
    steps:
      - uses: actions/checkout@v4
        with:
          path: rio
      - id: pin
        run: |
          echo "repo=$(grep -oP 'github\.com/\K[^/]+/rio-hw(?=\.git@)' pyproject.toml)" >> "$GITHUB_OUTPUT"
          echo "ref=$(grep -oP 'rio-hw\.git@\K[^"\s]+' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: rio-hw
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: rio/uv.lock
      - run: uv sync --group dev --group pi --extra kassow
      - run: make smoke-station
      - run: make test-pi
